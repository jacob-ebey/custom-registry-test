name: Publish

on:
  push:
    tags: [v*]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://atpm.dev/registry
          package-manager-cache: false
      - run: echo $ACTIONS_ID_TOKEN_REQUEST_URL
      - run: npm stage publish --provenance
        working-directory: counter
